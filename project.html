<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Project — Razin Shaikh</title>
    <meta name="description" content="Project details by Razin Shaikh.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --bg: #f4f1eb;
            --ink: #111;
            --muted: #706d66;
            --line: #d9d5cd;
            --card: #fff;
            --accent: #d8ff3e
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: "DM Sans", sans-serif
        }

        a {
            color: inherit;
            text-decoration: none
        }

        .wrap {
            max-width: 1240px;
            margin: auto;
            padding: 0 28px
        }

        nav {
            height: 82px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line)
        }

        .logo {
            font: 700 24px "Space Grotesk"
        }

        .back {
            font-size: 14px;
            font-weight: 600;
            opacity: .72
        }

        .back:hover {
            opacity: 1
        }

        .hero {
            padding: 90px 0 55px
        }

        .eyebrow {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .15em;
            color: var(--muted)
        }

        h1 {
            font: 600 clamp(55px, 9vw, 120px)/.88 "Space Grotesk";
            letter-spacing: -.07em;
            max-width: 1050px;
            margin: 22px 0
        }

        .intro {
            max-width: 700px;
            font-size: 19px;
            line-height: 1.55;
            color: #57544e
        }

        .meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 28px
        }

        .pill {
            border: 1px solid #bcb8af;
            border-radius: 999px;
            padding: 9px 13px;
            font-size: 12px;
            background: rgba(255, 255, 255, .3)
        }

        .gallery-head {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 20px;
            margin: 20px 0 20px
        }

        .gallery-head h2,
        .details h2,
        .more h2 {
            font: 600 clamp(38px, 5vw, 66px)/.95 "Space Grotesk";
            letter-spacing: -.06em;
            margin: 0
        }

        .gallery-head p {
            margin: 0;
            color: #7a776f;
            font-size: 13px
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 16px
        }

        .shot {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 24px;
            overflow: hidden;
            min-height: 300px;
            position: relative
        }

        .shot.large {
            grid-column: span 7;
            min-height: 460px
        }

        .shot.medium {
            grid-column: span 5;
            min-height: 360px
        }

        .shot.portrait {
            grid-column: span 5;
            min-height: 650px
        }

        .shot.full {
            grid-column: 1 / -1;
            min-height: 500px
        }

        .shot.scan,
        .shot.wide {
            grid-column: 1 / -1;
            min-height: 670px
        }

        .shot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .shot.portrait img,
        .shot.scan img,
        .shot.wide img {
            object-fit: contain
        }

        .shot-caption {
            position: absolute;
            left: 18px;
            bottom: 18px;
            background: rgba(17, 17, 17, .88);
            color: #fff;
            border-radius: 999px;
            padding: 9px 12px;
            font-size: 11px;
            z-index: 3
        }

        .live-shot {
            background: #ddd9d1;
            padding: 16px
        }

        .live-shot .live-browser {
            width: 100%;
            height: 100%;
            min-height: inherit;
            background: #fff;
            border-radius: 17px;
            overflow: hidden;
            box-shadow: 0 18px 45px rgba(0, 0, 0, .14);
            border: 1px solid #d5d1ca
        }

        .live-shot .live-browserbar {
            height: 31px;
            background: #f5f4f1;
            border-bottom: 1px solid #e5e2dc;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 11px
        }

        .live-shot .live-browserbar i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #b8b6b1
        }

        .live-shot .live-browserbar span {
            font-size: 8px;
            color: #92908a;
            margin-left: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .live-shot iframe {
            display: block;
            width: 100%;
            height: calc(100% - 31px);
            min-height: 400px;
            border: 0;
            background: #fff
        }

        .live-shot .live-link {
            position: absolute;
            inset: 0;
            z-index: 5;
            cursor: pointer
        }

        .live-badge {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 4;
            background: rgba(17, 17, 17, .9);
            color: #fff;
            border-radius: 999px;
            padding: 9px 12px;
            font-size: 10px;
            font-weight: 600;
            backdrop-filter: blur(8px)
        }

        .shot-fallback {
            width: 100%;
            height: 100%;
            min-height: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px;
            overflow: hidden
        }

        .browser-frame {
            width: 92%;
            height: 86%;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 22px 50px rgba(0, 0, 0, .16);
            overflow: hidden;
            border: 1px solid #dedbd4
        }

        .browserbar {
            height: 29px;
            background: #f3f2ef;
            border-bottom: 1px solid #e7e4de;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 10px
        }

        .browserbar i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #bbb
        }

        .browserbar span {
            font-size: 8px;
            color: #999;
            margin-left: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }

        .fake-ui {
            padding: 28px
        }

        .fake-label {
            font-size: 8px;
            letter-spacing: .14em;
            color: #999;
            text-transform: uppercase
        }

        .fake-title {
            font: 600 40px/.9 "Space Grotesk";
            letter-spacing: -.06em;
            margin-top: 8px
        }

        .fake-lines {
            display: grid;
            gap: 8px;
            margin-top: 25px
        }

        .fake-lines i {
            display: block;
            height: 10px;
            border-radius: 6px;
            background: #e6e3dd
        }

        .fake-lines i:nth-child(1) {
            width: 70%
        }

        .fake-lines i:nth-child(2) {
            width: 90%
        }

        .fake-lines i:nth-child(3) {
            width: 48%
        }

        .fake-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 9px;
            margin-top: 25px
        }

        .fake-cards i {
            height: 65px;
            border-radius: 10px;
            background: #f0eee8;
            border: 1px solid #dfdbd3
        }

        .mock-medicine {
            background: linear-gradient(135deg, #e8f2ef, #f8f4eb)
        }

        .mock-result {
            background: linear-gradient(135deg, #f1edff, #eff5ed)
        }

        .mock-foot {
            background: #192b25
        }

        .mock-cars {
            background: #d5d1c8
        }

        .mock-school {
            background: #e9efe8
        }

        .mock-salon {
            background: #e3d0ad
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 65px;
            padding: 100px 0
        }

        .details p {
            font-size: 18px;
            line-height: 1.65;
            color: #5f5c55;
            margin-top: 0
        }

        .detail-block {
            border-top: 1px solid var(--line);
            padding: 23px 0
        }

        .detail-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: #8b8880;
            margin-bottom: 9px
        }

        .detail-value {
            font-size: 16px;
            line-height: 1.55
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 30px
        }

        .btn {
            display: inline-flex;
            border: 1px solid #111;
            border-radius: 999px;
            padding: 13px 18px;
            background: #111;
            color: #fff;
            font-size: 14px;
            font-weight: 600
        }

        .btn.light {
            background: transparent;
            color: #111
        }

        .case {
            margin: 92px 0 100px
        }

        .case-intro {
            display: grid;
            grid-template-columns: 1.15fr .85fr;
            gap: 30px;
            padding: 45px;
            border: 1px solid var(--line);
            border-radius: 28px;
            background: #fff
        }

        .case-kicker,
        .story-label {
            font-size: 10px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: #817d75;
            font-weight: 700
        }

        .case-intro h2 {
            font: 600 clamp(37px, 5vw, 65px)/.94 "Space Grotesk";
            letter-spacing: -.06em;
            margin: 13px 0 0
        }

        .case-summary {
            font-size: 18px;
            line-height: 1.6;
            color: #58554f;
            margin: 0
        }

        .case-facts {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 26px
        }

        .case-facts span {
            border: 1px solid #d8d4cc;
            border-radius: 999px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 600
        }

        .story-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 16px
        }

        .story-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 30px;
            min-height: 220px
        }

        .story-card.wide {
            grid-column: 1 / -1
        }

        .story-card h3 {
            font: 600 28px/1 "Space Grotesk";
            letter-spacing: -.04em;
            margin: 12px 0
        }

        .story-card p,
        .story-card li {
            font-size: 15px;
            line-height: 1.62;
            color: #5f5b54
        }

        .story-card p {
            margin: 0
        }

        .story-card ul,
        .story-card ol {
            padding-left: 20px;
            margin: 16px 0 0
        }

        .story-card li+li {
            margin-top: 8px
        }

        .story-card.positive {
            background: #d8ff3e;
            border-color: #111
        }

        .story-card.caution {
            background: #edeae3
        }

        .case.medicine .case-intro {
            background: linear-gradient(135deg, #e8f5f1, #fff)
        }

        .case.results .case-intro {
            background: linear-gradient(135deg, #f0ebff, #fff)
        }

        .case.football .case-intro {
            background: #172a24;
            color: #fff;
            border-color: #172a24
        }

        .case.football .case-kicker,
        .case.football .case-summary {
            color: #c3d1cc
        }

        .case.football .case-facts span {
            border-color: #52635e
        }

        .case.football .story-card:first-child {
            background: #172a24;
            color: #fff;
            border-color: #172a24
        }

        .case.football .story-card:first-child p {
            color: #c3d1cc
        }

        .case.cars .story-grid {
            grid-template-columns: .8fr 1.2fr
        }

        .case.school .case-intro {
            background: #eef3ed
        }

        .case.salon .case-intro {
            background: #f1e3cc
        }

        .gallery.results .shot.large {
            grid-column: span 8
        }

        .gallery.results .shot.medium {
            grid-column: span 4
        }

        .gallery.football .shot.large {
            grid-column: span 5
        }

        .gallery.football .shot.medium {
            grid-column: span 7
        }

        .gallery.cars .shot.large {
            grid-column: span 6
        }

        .gallery.cars .shot.medium {
            grid-column: span 6
        }

        .gallery.school .shot.large {
            grid-column: span 9
        }

        .gallery.school .shot.medium {
            grid-column: span 3
        }

        .gallery.salon .shot.large {
            grid-column: span 4
        }

        .gallery.salon .shot.medium {
            grid-column: span 8
        }

        .case-intro {
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent !important
        }

        .case-flow {
            display: grid;
            gap: 22px;
            margin-top: 34px
        }

        .case-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 410px;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 26px;
            overflow: hidden
        }

        .case-row:nth-child(even) .case-copy {
            order: 2
        }

        .case-row:nth-child(even) .case-media {
            order: 1
        }

        .case-copy {
            padding: 42px;
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        .case-copy h3 {
            font: 600 clamp(30px, 3.5vw, 48px)/.95 "Space Grotesk";
            letter-spacing: -.05em;
            margin: 13px 0 18px
        }

        .case-copy p,
        .case-copy li {
            font-size: 16px;
            line-height: 1.65;
            color: #5f5b54
        }

        .case-copy p {
            margin: 0
        }

        .case-copy ul,
        .case-copy ol {
            margin: 0;
            padding-left: 20px
        }

        .case-copy li+li {
            margin-top: 8px
        }

        .case-media {
            background: #e8e5de;
            min-height: 410px;
            display: grid;
            place-items: center;
            overflow: hidden
        }

        .case-media img,
        .case-media video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .case-media.portrait img {
            object-fit: contain
        }

        .case-row.positive .case-copy {
            background: #d8ff3e
        }

        .case-row.caution .case-copy {
            background: #edeae3
        }

        .case.football .case-row:first-child .case-copy {
            background: #172a24;
            color: #fff
        }

        .case.football .case-row:first-child .case-copy p {
            color: #c3d1cc
        }

        .case-media.contain img {
            object-fit: contain
        }

        .case-media.portrait {
            padding: 20px;
            background: linear-gradient(135deg, #e8f3ef, #f8f4eb)
        }

        .case-media.portrait img {
            width: auto;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 18px 36px rgba(0, 0, 0, .16)
        }

        .case.medicine .case-row:first-child,
        .case.medicine .case-row:first-child .case-media {
            min-height: 330px
        }

        .case.medicine .case-row:first-child .case-media.portrait {
            padding: 30px
        }

        .case.medicine .case-row:first-child .case-media.portrait img {
            height: 82%
        }

        .hospital-hero {
            margin: 50px 0 0;
            padding: 55px;
            border-radius: 32px;
            background: radial-gradient(circle at 88% 8%, #c7f7e6 0, transparent 30%), linear-gradient(135deg, #073d3d, #0c6e63);
            color: #fff;
            overflow: hidden
        }

        .hospital-hero .eyebrow {
            color: #a7f6d8
        }

        .hospital-hero h1 {
            font-size: clamp(42px, 6vw, 78px);
            max-width: 850px;
            margin: 16px 0
        }

        .hospital-hero .intro {
            color: #e0fff4;
            max-width: 720px
        }

        .hospital-hero .meta .pill {
            border-color: rgba(255, 255, 255, .35);
            background: rgba(255, 255, 255, .08)
        }

        .hospital-overview {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 24px;
            margin: 24px 0 0
        }

        .hospital-flow {
            background: #fff;
            border: 1px solid #c4e8dd;
            border-radius: 28px;
            overflow: hidden
        }

        .hospital-flow img {
            display: block;
            width: 100%;
            height: auto
        }

        .hospital-summary {
            background: #e6fff4;
            border: 1px solid #c4e8dd;
            border-radius: 28px;
            padding: 38px;
            color: #073d3d
        }

        .hospital-summary h2 {
            font: 600 34px/1 "Space Grotesk";
            letter-spacing: -.04em;
            margin: 10px 0 18px
        }

        .hospital-summary p {
            font-size: 16px;
            line-height: 1.65;
            margin: 0
        }

        .hospital-summary ul {
            padding-left: 20px;
            line-height: 1.6
        }

        .hospital-summary li+li {
            margin-top: 8px
        }

        .case.hospital {
            margin-top: 58px
        }

        .case.hospital .case-intro h2 {
            font-size: clamp(32px, 4.2vw, 54px);
            color: #073d3d
        }

        .case.hospital .case-facts span {
            border-color: #8fd8c2;
            background: #edfff7;
            color: #075446
        }

        .case.hospital .case-row {
            border-color: #bfe4d9
        }

        .case.hospital .case-row:first-child .case-copy {
            background: #073d3d;
            color: #fff
        }

        .case.hospital .case-row:first-child .case-copy p {
            color: #d9fff1
        }

        .case.hospital .case-row:nth-child(3) .case-copy {
            background: #e8fff4
        }

        .case.hospital .case-row.caution .case-copy {
            background: #fff4e6
        }

        .case.hospital .case-media {
            background: #effbf6
        }

        .quran-hero {
            margin: 50px 0 0;
            padding: 52px;
            border-radius: 32px;
            background: radial-gradient(circle at 92% 8%, #d9ead8 0, transparent 28%), linear-gradient(135deg, #fcfaf4, #f0ebdc);
            border: 1px solid #ded6be;
            color: #173d2b
        }

        .quran-hero .eyebrow {
            color: #8b641d
        }

        .quran-hero h1 {
            font-size: clamp(44px, 6vw, 78px);
            max-width: 780px;
            margin: 14px 0
        }

        .quran-hero .intro {
            color: #4e594d
        }

        .quran-hero .pill {
            border-color: #cbbf9e;
            background: #fffdf7
        }

        .quran-intro {
            display: grid;
            grid-template-columns: .85fr 1.15fr;
            gap: 24px;
            margin-top: 24px
        }

        .quran-intro .quran-art {
            background: #f7f2e6;
            border: 1px solid #ded6be;
            border-radius: 28px;
            overflow: hidden
        }

        .quran-art img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .quran-guide {
            background: #174c35;
            color: #f6f0df;
            border-radius: 28px;
            padding: 40px
        }

        .quran-guide h2 {
            font: 600 36px/1 "Space Grotesk";
            letter-spacing: -.04em;
            margin: 10px 0 18px
        }

        .quran-guide p {
            font-size: 17px;
            line-height: 1.65
        }

        .quran-guide ol {
            padding-left: 22px;
            line-height: 1.7
        }

        .case.quran .case-intro h2 {
            font-size: clamp(32px, 4.2vw, 54px);
            color: #174c35
        }

        .case.quran .case-facts span {
            border-color: #cbbf9e;
            background: #fffcf4;
            color: #6e4d15
        }

        .case.quran .case-row {
            border-color: #dfd5bd
        }

        .case.quran .case-row:first-child .case-copy {
            background: #174c35;
            color: #fffaf0
        }

        .case.quran .case-row:first-child .case-copy p {
            color: #e0eedc
        }

        .case.quran .case-row:nth-child(3) .case-copy {
            background: #f7eed8
        }

        .case-media.youtube {
            background: #101010
        }

        .case-media.youtube iframe {
            width: 100%;
            height: 100%;
            border: 0
        }

        .more {
            border-top: 1px solid var(--line);
            padding: 70px 0
        }

        .more h2 {
            margin-bottom: 28px
        }

        .project-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px
        }

        .project-link {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 22px;
            transition: .25s
        }

        .project-link:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, .08)
        }

        .project-link small {
            color: #8b8880
        }

        .project-link strong {
            display: block;
            font: 600 21px "Space Grotesk";
            margin-top: 10px
        }

        .youtube-local {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: radial-gradient(circle at 50% 45%, #3d2454, #101010 65%);
            color: #fff;
            text-align: center;
            padding: 28px
        }

        .youtube-local b {
            font: 600 28px "Space Grotesk"
        }

        .youtube-local span {
            max-width: 310px;
            line-height: 1.5;
            color: #ded5e5
        }

        .youtube-local em {
            font-style: normal;
            background: #fff;
            color: #111;
            border-radius: 999px;
            padding: 11px 16px;
            font-weight: 700
        }

        footer {
            border-top: 1px solid var(--line);
            padding: 25px 0 35px;
            color: #777;
            font-size: 13px;
            display: flex;
            justify-content: space-between
        }

        @media(max-width:800px) {
            .hero {
                padding-top: 65px
            }

            .gallery {
                display: block
